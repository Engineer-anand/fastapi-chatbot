<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Groq AI Chatbot — Lightning-fast AI conversations powered by Groq LLMs">
    <title>Groq Chatbot — AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">

        <!-- HEADER -->
        <header class="header" id="header">
            <div class="header-left">
                <div class="logo-icon">⚡</div>
                <div>
                    <div class="header-title">Groq Chatbot</div>
                    <div class="header-subtitle">Powered by LLaMA 3.3</div>
                </div>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                Online
            </div>
        </header>

        <!-- CHAT AREA -->
        <main class="chat-area" id="chat-area">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">🤖</div>
                <h1 class="welcome-title">Hey! How can I help?</h1>
                <p class="welcome-desc">
                    I'm your AI assistant powered by Groq's ultra-fast inference. Ask me anything — I respond in real-time!
                </p>
                <div class="suggestions">
                    <button class="suggestion-chip" onclick="useSuggestion(this)">Explain async/await in Python</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">Write a FastAPI hello world</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">What is machine learning?</button>
                </div>
            </div>
        </main>

        <!-- INPUT AREA -->
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="chat-input" placeholder="Type your message..." rows="1"></textarea>
                <button id="send-btn" title="Send message" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
        </footer>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
